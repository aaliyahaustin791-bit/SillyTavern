<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MobileTavern — boot screen preview</title>
    <!-- FORK: live preview of the boot screen. Loads the REAL loader.css, so what you see
         here is what #preloader + the app-init splash render. Open it at
         http://127.0.0.1:8010/fork-boot-preview.html — no restart needed.

         Layout note: this page uses .mt-boot-screen (the same rules as #preloader, minus the
         fixed positioning) at min-height 100dvh, with the icon strip in NORMAL FLOW below it.
         v1 put the strip position:fixed over the boot block and it covered the status line and
         progress bar — never overlay the thing you are asking someone to review. -->
    <link rel="stylesheet" type="text/css" href="css/loader.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        html, body { margin: 0; background: #0b0710; }
        .preview-tag {
            position: absolute; top: 10px; left: 12px;
            font: 500 11px/1.4 system-ui, sans-serif; letter-spacing: .12em;
            color: #e8b563; opacity: .6; text-transform: uppercase;
        }
        .preview-screen { position: relative; min-height: 100dvh; }
        .preview-strip {
            padding: 22px 14px 34px;
            border-top: 1px solid rgba(232, 181, 99, .16);
            background: #0b0710;
        }
        .preview-strip h2 {
            margin: 0 0 16px; text-align: center;
            font: 600 11px/1 system-ui, sans-serif; letter-spacing: .18em;
            color: rgba(244, 234, 217, .45); text-transform: uppercase;
        }
        .preview-icons {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 16px; flex-wrap: wrap;
        }
        .preview-icons figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
        .preview-icons img { display: block; }
        .preview-icons .tile { border-radius: 22%; }
        .preview-icons figcaption {
            font: 500 10px/1 system-ui, sans-serif; color: rgba(244, 234, 217, .5); letter-spacing: .08em;
        }
    </style>
</head>
<body class="no-blur">
    <div class="preview-screen mt-boot-screen">
        <div class="mt-boot">
            <div class="mt-boot-glow" aria-hidden="true"></div>
            <img class="mt-boot-mark" src="img/mt-logo-charm.png" alt="MobileTavern">
            <div class="mt-boot-wordmark">Mobile<span>Tavern</span></div>
            <div class="mt-boot-tagline">Your stories are waiting.</div>
            <div class="mt-boot-status" id="preview-status">Setting the table…</div>
            <div class="mt-boot-bar" aria-hidden="true"><i></i></div>
        </div>
        <div class="preview-tag">boot screen preview</div>
    </div>

    <div class="preview-strip">
        <h2>App icon &amp; favicon sizes</h2>
        <div class="preview-icons">
            <figure><img class="tile" src="img/apple-icon-57x57.png" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
            <figure><img class="tile" src="img/apple-icon-57x57.png" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
            <figure><img class="tile" src="img/apple-icon-57x57.png" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
            <figure><img class="tile" src="img/apple-icon-57x57.png" width="57" height="57" alt=""><figcaption>57</figcaption></figure>
            <figure><img class="tile" src="img/apple-icon-114x114.png" width="76" height="76" alt=""><figcaption>114</figcaption></figure>
            <figure><img class="tile" src="img/apple-icon-192x192.png" width="96" height="96" alt=""><figcaption>192</figcaption></figure>
            <figure><img src="img/mt-tankard.png" height="86" alt=""><figcaption>tankard</figcaption></figure>
            <figure><img src="img/logo.png" width="86" height="86" alt=""><figcaption>logo.png</figcaption></figure>
            <figure><img src="img/mt-logo-charm.png" height="120" alt=""><figcaption>boot mark</figcaption></figure>
        </div>
    </div>

    <script>
        // Mimic the splash's rotating status line (the static #preloader can't rotate).
        const lines = ['Setting the table…', 'Warming the hearth…', 'Lighting the lanterns…', 'Opening the shutters…', 'Waking Momo-chan…'];
        const el = document.getElementById('preview-status');
        let i = 0;
        setInterval(() => { el.textContent = lines[++i % lines.length]; }, 3200);
        console.log('[fork-boot-preview] boot screen preview loaded');
    </script>
</body>
</html>
