<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MobileTavern — boot screen preview</title>
    <!-- FORK: live preview of the boot screen. Loads the REAL loader.css, so what you
         see here is exactly what #preloader + the app-init splash render. Open it at
         http://127.0.0.1:8010/fork-boot-preview.html — no restart needed. -->
    <link rel="stylesheet" type="text/css" href="css/loader.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        .preview-tag {
            position: fixed; top: 10px; left: 12px; z-index: 1000000;
            font: 500 11px/1.4 system-ui, sans-serif; letter-spacing: .12em;
            color: #e8b563; opacity: .65; text-transform: uppercase;
        }
        .preview-icons {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000000;
            display: flex; align-items: flex-end; justify-content: center;
            gap: 18px; padding: 14px 12px 18px; flex-wrap: wrap;
        }
        .preview-icons figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .preview-icons img { display: block; border-radius: 22%; }
        .preview-icons figcaption {
            font: 500 10px/1 system-ui, sans-serif; color: rgba(244,234,217,.5); letter-spacing: .08em;
        }
    </style>
</head>
<body class="no-blur" style="margin:0; background:#141019;">
    <div id="preloader">
        <div class="mt-boot">
            <div class="mt-boot-glow" aria-hidden="true"></div>
            <img class="mt-boot-mark" src="img/mt-logo-charm.png" alt="MobileTavern">
            <div class="mt-boot-wordmark">Mobile<span>Tavern</span></div>
            <div class="mt-boot-tagline">Your stories are waiting.</div>
            <div class="mt-boot-status" id="preview-status">Setting the table…</div>
            <div class="mt-boot-bar" aria-hidden="true"><i></i></div>
        </div>

        <div class="preview-tag">boot screen preview</div>
        <div class="preview-icons">
            <figure><img src="favicon.ico" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
            <figure><img src="img/apple-icon-57x57.png" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
            <figure><img src="img/apple-icon-57x57.png" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
            <figure><img src="img/apple-icon-57x57.png" width="57" height="57" alt=""><figcaption>57</figcaption></figure>
            <figure><img src="img/apple-icon-114x114.png" width="78" height="78" alt=""><figcaption>114</figcaption></figure>
            <figure><img src="img/apple-icon-192x192.png" width="104" height="104" alt=""><figcaption>192</figcaption></figure>
            <figure><img src="img/logo.png" width="86" height="86" alt=""><figcaption>logo.png</figcaption></figure>
        </div>
    </div>

    <script>
        // Mimic the splash's rotating status line (the static #preloader can't rotate).
        const lines = ['Setting the table…', 'Warming the hearth…', 'Lighting the lanterns…', 'Opening the shutters…', 'Waking Momo-chan…'];
        const el = document.getElementById('preview-status');
        let i = 0;
        setInterval(() => { el.textContent = lines[++i % lines.length]; }, 3200);
        console.log('[fork-boot-preview] boot screen preview loaded');
    </script>
</body>
</html>
